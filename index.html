<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="todolist.css">
  <script src="todolist.js"></script>
</head>
<body>
  <div class="container" id="authContainer">
    <h1>Connexion</h1>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Mot de passe" />
	<input type="text" id="registerUsername" placeholder="Nom d'utilisateur (inscription uniquement)" />
    <button onclick="register()">Créer un compte</button>
    <button onclick="login()">Se connecter</button>
    <p id="message"></p>
  </div>

  <div class="container" id="todoContainer" style="display: none;">
    <h1>To-Do List</h1>
    <p id="welcome"></p>
    <input type="text" id="taskInput" placeholder="Ajouter une tâche..." />
    <button id="addTaskBtn">Ajouter</button>
    <input type="text" id="searchInput" placeholder="Rechercher une tâche..." />
    <ul id="taskList"></ul>
    <button onclick="logout()">Se déconnecter</button>
  </div>
 
</body>
</html>
